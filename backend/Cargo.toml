[package]
name = "docutrade-backend"
version = "0.1.0"
edition = "2021"
description = "DocuTrade - Decentralized Export Verification Platform Backend"

[dependencies]
# Web framework
axum = { version = "0.7.5", features = ["macros", "multipart"] }
tokio = { version = "1.37.0", features = ["full"] }
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }

# Serialization & Deserialization
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"

# Auth & Crypto
jsonwebtoken = "9.3.0"
argon2 = "0.5.3"
rand = "0.8.5"
sha2 = "0.10.8"

# Utilities
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
anyhow = "1.0.82"
thiserror = "1.0.59"

# Web3 / Blockchain (Alloy)
alloy = { version = "0.1.1", features = ["full", "providers", "rpc-types", "network", "signers", "node-bindings"] }

# IPFS client (reqwest as a generic client to talk to IPFS nodes)
reqwest = { version = "0.12.4", features = ["json", "multipart"] }
rust_decimal = "1.42.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
